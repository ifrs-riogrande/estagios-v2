<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="../assets/img/fav.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diretoria de Extensão — DEX — SGE IFRS Campus Rio Grande</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/layout.css">

  <!-- Google Identity Services (necessário para revogar o token no logout) -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

  <!-- ═══════════════════════════════════════
       HEADER — logo à esquerda; sino, perfil e voltar à direita (igual v1)
       ═══════════════════════════════════════ -->
  <header id="app-header">
    <div class="container">
      <div class="header-inner">
        <a href="../index.html" class="header-brand">
          <span class="header-logo-wrap"><img src="../assets/img/logo-ifrs.png" alt="IFRS" class="header-logo"></span>
        </a>
        <div style="display:flex;align-items:center;gap:var(--space-3);">
          <div id="header-user-area"></div>
        </div>
      </div>
    </div>
  </header>

  <!-- ═══════════════════════════════════════
       CONTEÚDO
       ═══════════════════════════════════════ -->
  <main id="main-content">
    <section class="page-hero">
      <div class="container">
        <h1 class="page-hero-title">Diretoria de Extensão — DEX</h1>
        <p class="page-hero-desc">
          Pareceres finais de estágio não obrigatório aguardando análise.
        </p>
      </div>
    </section>

    <div class="container" style="padding-top:var(--space-6);padding-bottom:var(--space-12);">

      <div id="painel-carregando" class="empty-state">
        <div class="spinner" aria-hidden="true"></div>
        <p>Carregando…</p>
      </div>

      <div id="lista-vazia" class="empty-state hidden">
        <p>Nenhum parecer final aguardando a DEX no momento.</p>
      </div>

      <div id="lista-parecerfinal-dex"></div>

    </div>
  </main>

  <!-- Modal: Parecer Final de Estágio (DEX) -->
  <div class="modal-backdrop" id="modal-parecerfinal">
    <div class="modal">
      <div class="modal-header">
        <h2 class="modal-title" id="modal-parecerfinal-titulo">Parecer Final de Estágio</h2>
        <button type="button" class="modal-close" id="modal-parecerfinal-fechar" aria-label="Fechar">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"/></svg>
        </button>
      </div>
      <div class="modal-body" id="modal-parecerfinal-body"></div>
      <div class="modal-footer" id="modal-parecerfinal-footer"></div>
    </div>
  </div>

  <!-- ═══════════════════════════════════════
       FOOTER
       ═══════════════════════════════════════ -->
  <footer id="app-footer">
    <div class="container">
      <div class="footer-inner">
        <span class="footer-copy">
          &copy; <span id="footer-year"></span> Central de Estágios — IFRS Campus Rio Grande
        </span>
        <nav class="footer-links" aria-label="Links do rodapé">
          <a href="mailto:estagios@riogrande.ifrs.edu.br">estagios@riogrande.ifrs.edu.br</a>
        </nav>
      </div>
    </div>
  </footer>

  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/notifications-bell.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script>
    document.getElementById('footer-year').textContent = new Date().getFullYear();

    var _pareceresFinaisDex = [];

    // Guarda de acesso: por enquanto exige só sessão de servidor (qualquer
    // @riogrande...). A checagem do papel "DEX" de verdade acontece no
    // backend, na ConfigAcesso — ainda não há dados reais lá.
    document.addEventListener('DOMContentLoaded', function () {
      requireAreaAuth('servidor', '../index.html');
      carregarPareceresFinaisDex();
      document.getElementById('modal-parecerfinal-fechar').addEventListener('click', fecharParecerFinalDex);
      document.getElementById('modal-parecerfinal').addEventListener('click', function (e) { if (e.target === this) fecharParecerFinalDex(); });
    });

    function carregarPareceresFinaisDex() {
      document.getElementById('painel-carregando').classList.remove('hidden');
      document.getElementById('lista-vazia').classList.add('hidden');
      API.get('listarPareceresPendentes', { papel: 'diretoria', ref: 'DEX' }).then(function (lista) {
        _pareceresFinaisDex = Array.isArray(lista) ? lista : [];
        document.getElementById('painel-carregando').classList.add('hidden');

        if (!_pareceresFinaisDex.length) {
          document.getElementById('lista-vazia').classList.remove('hidden');
          document.getElementById('lista-parecerfinal-dex').innerHTML = '';
          return;
        }

        document.getElementById('lista-parecerfinal-dex').innerHTML = _pareceresFinaisDex.map(function (p) {
          return '<div class="card" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:var(--space-3);margin-bottom:var(--space-3);padding:var(--space-4);">' +
            '<div>' +
            '<div style="font-weight:600;margin-bottom:2px;">' + escapeHtml(p.nomeAluno || '—') + '</div>' +
            '<div style="font-size:var(--font-size-xs);color:var(--color-text-muted);">' + escapeHtml(p.curso || '—') + ' · ' + escapeHtml(String(p.totalHoras || 0)) + 'h</div>' +
            '</div>' +
            '<button type="button" class="btn btn-primary btn-sm" data-parecerfinal-id="' + escapeHtml(p.idEstagio) + '">Preencher Parecer</button>' +
            '</div>';
        }).join('');
      }).catch(function (err) {
        document.getElementById('painel-carregando').classList.add('hidden');
        document.getElementById('lista-parecerfinal-dex').innerHTML =
          '<div class="alert alert-error"><div class="alert-content">Não foi possível carregar os pareceres. ' + escapeHtml(err.message) + '</div></div>';
      });
    }

    document.getElementById('lista-parecerfinal-dex').addEventListener('click', function (e) {
      var btn = e.target.closest('button[data-parecerfinal-id]');
      if (!btn) return;
      var item = _pareceresFinaisDex.find(function (x) { return String(x.idEstagio) === btn.dataset.parecerfinalId; });
      if (item) abrirParecerFinalDex(item);
    });

    function abrirParecerFinalDex(p) {
      document.getElementById('modal-parecerfinal-titulo').textContent = 'Parecer Final — ' + (p.nomeAluno || 'Estágio');

      var parecerCoordHtml = p.parecerCoordenador
        ? '<div style="border:1px solid var(--color-border);border-radius:var(--radius-md);padding:var(--space-3) var(--space-4);margin-bottom:var(--space-4);">' +
          '<h4 style="font-size:var(--font-size-sm);font-weight:700;margin:0 0 var(--space-2);">Parecer do Coordenador</h4>' +
          '<div style="font-size:var(--font-size-sm);margin-bottom:4px;">' + (p.parecerCoordenador.resultado === 'aprovado' ? 'Aprovado' : 'Reprovado') + '</div>' +
          (p.parecerCoordenador.texto ? '<div style="font-size:var(--font-size-sm);">' + escapeHtml(p.parecerCoordenador.texto) + '</div>' : '') +
          '</div>'
        : '';

      var html = '<div class="detail-grid" style="margin-bottom:var(--space-5);">' +
        '<div class="detail-item"><label>Curso</label><p>' + escapeHtml(p.curso || '—') + '</p></div>' +
        '<div class="detail-item"><label>Total de Horas</label><p>' + escapeHtml(String(p.totalHoras || 0)) + 'h</p></div>' +
        '</div>' +
        parecerCoordHtml +
        '<div class="form-group"><label class="form-label">Resultado</label>' +
        '<div class="radio-group">' +
        '<label class="radio-option"><input type="radio" name="parecerfinal-resultado" value="aprovado" checked> Aprovado</label>' +
        '<label class="radio-option"><input type="radio" name="parecerfinal-resultado" value="reprovado"> Reprovado</label>' +
        '</div></div>' +
        '<div class="form-group"><label class="form-label required" for="parecerfinal-texto">Parecer</label>' +
        '<textarea id="parecerfinal-texto" class="form-control" rows="4" maxlength="2000"></textarea></div>';

      document.getElementById('modal-parecerfinal-body').innerHTML = html;
      document.getElementById('modal-parecerfinal-footer').innerHTML =
        '<button type="button" class="btn btn-secondary" id="btn-fechar-parecerfinal">Fechar</button>' +
        '<button type="button" class="btn btn-primary btn-sm" id="btn-enviar-parecerfinal">Enviar Parecer</button>';

      document.getElementById('btn-fechar-parecerfinal').addEventListener('click', fecharParecerFinalDex);
      document.getElementById('btn-enviar-parecerfinal').addEventListener('click', function () { enviarParecerDiretoria(p.idEstagio, this); });

      document.getElementById('modal-parecerfinal').classList.add('is-open');
    }

    async function enviarParecerDiretoria(idEstagio, btn) {
      var texto = document.getElementById('parecerfinal-texto').value.trim();
      if (!texto) { showToast('Preencha o texto do parecer.', 'error'); return; }
      var resultado = document.querySelector('input[name="parecerfinal-resultado"]:checked').value;
      var orig = btn.textContent;
      btn.disabled = true; btn.textContent = 'Enviando…';
      try {
        await API.post('salvarParecerDiretoria', { idEstagio: idEstagio, resultado: resultado, texto: texto });
        showToast('✅ Parecer enviado para a Central de Estágios.', 'success');
        fecharParecerFinalDex();
        carregarPareceresFinaisDex();
      } catch (err) {
        showToast('Erro: ' + err.message, 'error');
        btn.disabled = false; btn.textContent = orig;
      }
    }

    function fecharParecerFinalDex() {
      document.getElementById('modal-parecerfinal').classList.remove('is-open');
    }
  </script>
</body>
</html>
