<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="../assets/img/fav.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Avaliação de Estágio — IFRS Campus Rio Grande">
  <title>Avaliação de Estágio — SGE IFRS Campus Rio Grande</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/layout.css">

  <style>
    .aval-public-main { padding: var(--space-8) 0; min-height: calc(100vh - 64px - 56px); }
    .aval-public-wrap { max-width: 640px; margin: 0 auto; padding: 0 var(--space-4); }
    .aval-public-header { margin-bottom: var(--space-6); text-align: center; }
    .aval-public-header h1 { font-size: var(--font-size-xl); margin: 0 0 var(--space-2); }
    .aval-public-header p { color: var(--color-text-muted); font-size: var(--font-size-sm); margin: 0; }
  </style>
</head>
<body>

  <header id="app-header">
    <div class="container">
      <div class="header-inner">
        <a href="https://ifrs-riogrande.github.io/estagios-v2/" class="header-brand">
          <span class="header-logo-wrap"><img src="../assets/img/logo-ifrs.png" alt="IFRS" class="header-logo"></span>
        </a>
      </div>
    </div>
  </header>

  <main class="aval-public-main">
    <div class="aval-public-wrap">
      <div class="aval-public-header">
        <h1>Avaliação de Estágio</h1>
        <p>Avaliação do(a) estagiário(a) pela Concedente</p>
      </div>

      <div id="aval-conteudo">
        <div class="empty-state">
          <div class="spinner" aria-hidden="true"></div>
          <p>Carregando…</p>
        </div>
      </div>
    </div>
  </main>

  <footer id="app-footer">
    <div class="container">
      <div class="footer-inner">
        <span class="footer-copy">
          &copy; <span id="footer-year"></span> Central de Estágios — IFRS Campus Rio Grande
        </span>
        <nav class="footer-links" aria-label="Links do rodapé">
          <a href="mailto:estagios@riogrande.ifrs.edu.br">estagios@riogrande.ifrs.edu.br</a>
        </nav>
      </div>
    </div>
  </footer>

  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/api.js"></script>
  <script>
    'use strict';

    document.getElementById('footer-year').textContent = new Date().getFullYear();

    var params = new URLSearchParams(window.location.search);
    var idEstagio = params.get('id');
    var avalId = params.get('aval');
    var token = params.get('token');

    var el = document.getElementById('aval-conteudo');

    function mostrarErro(msg) {
      el.innerHTML = '<div class="alert alert-error"><div class="alert-content">' + escapeHtml(msg) + '</div></div>';
    }

    if (!idEstagio || !avalId || !token) {
      mostrarErro('Link inválido: faltam parâmetros necessários. Verifique se você abriu o link completo recebido por e-mail.');
    } else {
      carregarAvaliacao();
    }

    async function carregarAvaliacao() {
      try {
        var a = await API.get('obterAvaliacaoConcedente', { id: idEstagio, aval: avalId, token: token });
        renderPagina(a);
      } catch (err) {
        mostrarErro(err.code === 'TOKEN_INVALIDO' || err.code === 'TOKEN_EXPIRADO'
          ? 'Este link não é mais válido. Ele pode ter expirado ou já ter sido respondido. Entre em contato com a instituição de ensino para receber um novo link.'
          : 'Erro ao carregar a avaliação: ' + err.message);
      }
    }

    function renderPagina(a) {
      if (a.status === 'concluido') {
        el.innerHTML = '<div class="alert alert-success"><div class="alert-content">Esta avaliação já foi respondida. Obrigado!</div></div>';
        return;
      }

      var html = '<div class="detail-grid" style="margin-bottom:var(--space-6);">' +
        '<div class="detail-item"><label>Estudante</label><p>' + escapeHtml(a.nomeEstudante || '—') + '</p></div>' +
        '<div class="detail-item"><label>Curso</label><p>' + escapeHtml(a.curso || '—') + '</p></div>' +
        '<div class="detail-item"><label>Período de referência</label><p>' + escapeHtml(a.periodoRef || a.periodo || '—') + '</p></div>' +
        '</div>' +
        '<div class="card" style="padding:var(--space-5);">' +
        '<div class="form-group"><label class="form-label required">Assiduidade e pontualidade</label>' +
        '<div class="radio-group">' +
        '<label class="radio-option"><input type="radio" name="aval-assiduidade" value="Excelente" checked> Excelente</label>' +
        '<label class="radio-option"><input type="radio" name="aval-assiduidade" value="Bom"> Bom</label>' +
        '<label class="radio-option"><input type="radio" name="aval-assiduidade" value="Regular"> Regular</label>' +
        '<label class="radio-option"><input type="radio" name="aval-assiduidade" value="Insatisfatório"> Insatisfatório</label>' +
        '</div></div>' +
        '<div class="form-group"><label class="form-label required">Desempenho técnico nas atividades</label>' +
        '<div class="radio-group">' +
        '<label class="radio-option"><input type="radio" name="aval-desempenho" value="Excelente" checked> Excelente</label>' +
        '<label class="radio-option"><input type="radio" name="aval-desempenho" value="Bom"> Bom</label>' +
        '<label class="radio-option"><input type="radio" name="aval-desempenho" value="Regular"> Regular</label>' +
        '<label class="radio-option"><input type="radio" name="aval-desempenho" value="Insatisfatório"> Insatisfatório</label>' +
        '</div></div>' +
        '<div class="form-group"><label class="form-label" for="aval-pontos-fortes">Pontos fortes</label>' +
        '<textarea id="aval-pontos-fortes" class="form-control" rows="3" maxlength="1000"></textarea></div>' +
        '<div class="form-group"><label class="form-label" for="aval-pontos-melhorar">Pontos a melhorar</label>' +
        '<textarea id="aval-pontos-melhorar" class="form-control" rows="3" maxlength="1000"></textarea></div>' +
        '<div class="form-group"><label class="form-label required">Recomendaria a continuidade do estágio?</label>' +
        '<div class="radio-group">' +
        '<label class="radio-option"><input type="radio" name="aval-recomenda" value="Sim" checked> Sim</label>' +
        '<label class="radio-option"><input type="radio" name="aval-recomenda" value="Não"> Não</label>' +
        '</div></div>' +
        '<div class="form-group"><label class="form-label" for="aval-observacoes">Observações <span style="font-weight:400;color:var(--color-text-muted);">(opcional)</span></label>' +
        '<textarea id="aval-observacoes" class="form-control" rows="3" maxlength="1000"></textarea></div>' +
        '<button type="button" class="btn btn-primary" id="btn-enviar-avaliacao-concedente">Enviar Avaliação</button>' +
        '</div>';

      el.innerHTML = html;
      document.getElementById('btn-enviar-avaliacao-concedente').addEventListener('click', enviarAvaliacao);
    }

    async function enviarAvaliacao() {
      var btn = document.getElementById('btn-enviar-avaliacao-concedente');
      var orig = btn.textContent;
      btn.disabled = true; btn.textContent = 'Enviando…';
      try {
        await API.post('responderAvaliacaoConcedente', {
          id: idEstagio,
          aval: avalId,
          token: token,
          assiduidade: document.querySelector('input[name="aval-assiduidade"]:checked').value,
          desempenho: document.querySelector('input[name="aval-desempenho"]:checked').value,
          pontosFortes: document.getElementById('aval-pontos-fortes').value.trim(),
          pontosMelhorar: document.getElementById('aval-pontos-melhorar').value.trim(),
          recomenda: document.querySelector('input[name="aval-recomenda"]:checked').value,
          observacoes: document.getElementById('aval-observacoes').value.trim(),
        });
        el.innerHTML = '<div class="alert alert-success"><div class="alert-content">✅ Avaliação enviada com sucesso. Obrigado pela parceria com o IFRS!</div></div>';
      } catch (err) {
        showToast('Erro: ' + err.message, 'error');
        btn.disabled = false; btn.textContent = orig;
      }
    }
  </script>
</body>
</html>
