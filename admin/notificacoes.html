<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="../assets/img/fav.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notificações — Admin — SGE IFRS Campus Rio Grande</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/layout.css">

  <!-- Google Identity Services (necessário para revogar o token no logout) -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    .header-brand-group { display: flex; align-items: center; gap: var(--space-5); flex-wrap: wrap; }
    .mega-nav-link { display: inline-flex; align-items: center; gap: 6px; padding: 14px 4px; font-size: var(--font-size-sm); font-weight: 600; color: var(--color-text); text-decoration: none; border-bottom: 2.5px solid transparent; transition: color .15s, border-color .15s; }
    a.mega-nav-link:hover { color: #2e7d32; }
    .mega-nav-link.is-current { color: #2e7d32; border-bottom-color: #2e7d32; }
  </style>
</head>
<body>

  <header id="app-header">
    <div class="container">
      <div class="header-inner">
        <div class="header-brand-group">
          <a href="../index.html" class="header-brand">
            <span class="header-logo-wrap"><img src="../assets/img/logo-ifrs.png" alt="IFRS" class="header-logo"></span>
          </a>
          <a href="cursos.html" class="mega-nav-link">Cursos</a>
          <a href="prazos.html" class="mega-nav-link">Prazos</a>
          <a href="notificacoes.html" class="mega-nav-link is-current">Notificações</a>
          <a href="acesso.html" class="mega-nav-link">Configurações de Acesso</a>
          <a href="tce.html" class="mega-nav-link">TCE — Apólice e Logo</a>
        </div>
        <div style="display:flex;align-items:center;gap:var(--space-3);">
          <div id="header-user-area"></div>
        </div>
      </div>
    </div>
  </header>

  <main id="main-content">
    <section class="page-hero">
      <div class="container">
        <h1 class="page-hero-title">Notificações</h1>
        <p class="page-hero-desc">Gerencie as notificações automáticas do sistema.</p>
      </div>
    </section>

    <div class="container" style="padding-top:var(--space-6);padding-bottom:var(--space-12);">

      <div class="page-tabs" role="tablist">
        <button class="page-tab is-active" role="tab" aria-selected="true" aria-controls="tab-destinatarios" id="btn-tab-destinatarios" type="button">Destinatários</button>
        <button class="page-tab" role="tab" aria-selected="false" aria-controls="tab-lembretes" id="btn-tab-lembretes" type="button">Lembretes Automáticos</button>
        <button class="page-tab" role="tab" aria-selected="false" aria-controls="tab-reenvios" id="btn-tab-reenvios" type="button">Reenvios</button>
        <button class="page-tab" role="tab" aria-selected="false" aria-controls="tab-emails" id="btn-tab-emails" type="button">E-mails do Sistema</button>
      </div>

      <!-- Aba: Destinatários -->
      <div class="tab-panel is-active" id="tab-destinatarios" role="tabpanel" aria-labelledby="btn-tab-destinatarios">
        <div class="card" style="padding:var(--space-5);">
          <div class="form-group"><label class="form-label" for="notif-email-geral">E-mail geral do setor</label><input type="email" id="notif-email-geral" class="form-control" placeholder="estagios@riogrande.ifrs.edu.br"></div>
          <div class="form-group"><label class="form-label" for="notif-email-obrigatorio">E-mail — Estágio Obrigatório</label><input type="email" id="notif-email-obrigatorio" class="form-control"></div>
          <div class="form-group"><label class="form-label" for="notif-email-nao-obrigatorio">E-mail — Estágio Não Obrigatório</label><input type="email" id="notif-email-nao-obrigatorio" class="form-control"></div>
          <div class="form-group"><label class="form-label" for="notif-email-erros">E-mail para relatórios de erro</label><input type="email" id="notif-email-erros" class="form-control"></div>
          <button type="button" class="btn btn-primary btn-sm" id="btn-salvar-destinatarios">Salvar Destinatários</button>
        </div>
      </div>

      <!-- Aba: Lembretes Automáticos -->
      <div class="tab-panel" id="tab-lembretes" role="tabpanel" aria-labelledby="btn-tab-lembretes">
        <div id="lista-lembretes"><div class="spinner" style="margin:0 auto;"></div></div>
      </div>

      <!-- Aba: Reenvios -->
      <div class="tab-panel" id="tab-reenvios" role="tabpanel" aria-labelledby="btn-tab-reenvios">
        <div class="card" style="padding:var(--space-5);">
          <div class="form-group" style="max-width:320px;"><label class="form-label" for="reenvio-id-estagio">ID do Estágio</label><input type="text" id="reenvio-id-estagio" class="form-control" placeholder="Ex: EST-RG26-0001"></div>
          <button type="button" class="btn btn-secondary btn-sm" id="btn-buscar-reenvios">Buscar Notificações Pendentes</button>
          <div id="lista-reenvios" style="margin-top:var(--space-4);"></div>
        </div>
      </div>

      <!-- Aba: E-mails do Sistema -->
      <div class="tab-panel" id="tab-emails" role="tabpanel" aria-labelledby="btn-tab-emails">
        <div style="display:flex;gap:var(--space-5);flex-wrap:wrap;">
          <div style="flex:0 0 220px;">
            <div id="lista-templates" class="card" style="padding:var(--space-3);"></div>
          </div>
          <div style="flex:1;min-width:280px;">
            <div id="editor-template" class="card" style="padding:var(--space-5);">
              <p style="font-size:var(--font-size-sm);color:var(--color-text-muted);">Selecione um template ao lado.</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer id="app-footer">
    <div class="container">
      <div class="footer-inner">
        <span class="footer-copy">
          &copy; <span id="footer-year"></span> Central de Estágios — IFRS Campus Rio Grande
        </span>
        <nav class="footer-links" aria-label="Links do rodapé">
          <a href="mailto:estagios@riogrande.ifrs.edu.br">estagios@riogrande.ifrs.edu.br</a>
        </nav>
      </div>
    </div>
  </footer>

  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/notifications-bell.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script>
    document.getElementById('footer-year').textContent = new Date().getFullYear();

    var FLUXOS_LEMBRETE = [
      { id: 'checklist', label: 'Checklist de Estágio' },
      { id: 'assinaturas', label: 'Assinaturas do TCE' },
      { id: 'avaliacoes', label: 'Avaliações de Estágio' },
      { id: 'adendo', label: 'Adendos ao TCE' },
    ];

    var TEMPLATES_EMAIL = [
      { id: 'boas-vindas', label: 'Boas-vindas ao Sistema' },
      { id: 'devolucao', label: 'Solicitação Devolvida' },
      { id: 'aprovacao', label: 'Solicitação Aprovada' },
      { id: 'lembrete-pendencia', label: 'Lembrete de Pendência' },
    ];

    document.addEventListener('DOMContentLoaded', function () {
      requireAreaAuth('servidor', '../index.html');
      initTabsNotificacoes();
      carregarDestinatarios();
      carregarLembretes();
      renderListaTemplates();
      document.getElementById('btn-salvar-destinatarios').addEventListener('click', salvarDestinatarios);
      document.getElementById('btn-buscar-reenvios').addEventListener('click', buscarReenvios);
    });

    function initTabsNotificacoes() {
      document.querySelectorAll('.page-tab').forEach(function (btn) {
        btn.addEventListener('click', function () {
          document.querySelectorAll('.page-tab').forEach(function (b) { b.classList.remove('is-active'); b.setAttribute('aria-selected', 'false'); });
          document.querySelectorAll('.tab-panel').forEach(function (p) { p.classList.remove('is-active'); });
          btn.classList.add('is-active');
          btn.setAttribute('aria-selected', 'true');
          var panel = document.getElementById(btn.getAttribute('aria-controls'));
          if (panel) panel.classList.add('is-active');
        });
      });
    }

    /* ── Destinatários ── */
    async function carregarDestinatarios() {
      try {
        var cfg = await API.get('obterConfigNotificacoes');
        cfg = (cfg && cfg.destinatarios) || {};
        document.getElementById('notif-email-geral').value = cfg.geral || '';
        document.getElementById('notif-email-obrigatorio').value = cfg.obrigatorio || '';
        document.getElementById('notif-email-nao-obrigatorio').value = cfg.naoObrigatorio || '';
        document.getElementById('notif-email-erros').value = cfg.erros || '';
      } catch (err) { /* falha silenciosa */ }
    }

    async function salvarDestinatarios() {
      var btn = document.getElementById('btn-salvar-destinatarios');
      var orig = btn.textContent;
      btn.disabled = true; btn.textContent = 'Salvando…';
      try {
        await API.post('salvarConfigNotificacoes', {
          destinatarios: {
            geral: document.getElementById('notif-email-geral').value.trim(),
            obrigatorio: document.getElementById('notif-email-obrigatorio').value.trim(),
            naoObrigatorio: document.getElementById('notif-email-nao-obrigatorio').value.trim(),
            erros: document.getElementById('notif-email-erros').value.trim(),
          },
        });
        showToast('✅ Destinatários salvos.', 'success');
      } catch (err) {
        showToast('Erro: ' + err.message, 'error');
      } finally {
        btn.disabled = false; btn.textContent = orig;
      }
    }

    /* ── Lembretes Automáticos ── */
    async function carregarLembretes() {
      var container = document.getElementById('lista-lembretes');
      var cfg = {};
      try {
        var resp = await API.get('obterConfigNotificacoes');
        cfg = (resp && resp.lembretes) || {};
      } catch (err) { /* segue com defaults */ }

      container.innerHTML = FLUXOS_LEMBRETE.map(function (f) {
        var c = cfg[f.id] || {};
        return '<div class="card" style="padding:var(--space-5);margin-bottom:var(--space-4);">' +
          '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--space-4);">' +
          '<h3 style="font-size:var(--font-size-md);font-weight:600;margin:0;">' + escapeHtml(f.label) + '</h3>' +
          '<label class="toggle-switch"><input type="checkbox" id="lemb-' + f.id + '-ativo"' + (c.ativo !== false ? ' checked' : '') + '><span class="toggle-track"></span></label>' +
          '</div>' +
          '<div class="form-row">' +
          '<div class="form-group"><label class="form-label">Canal</label>' +
          '<div class="form-check"><input type="checkbox" id="lemb-' + f.id + '-canal-email"' + (c.canalEmail !== false ? ' checked' : '') + '><label class="form-check-label" for="lemb-' + f.id + '-canal-email">E-mail</label></div>' +
          '<div class="form-check"><input type="checkbox" id="lemb-' + f.id + '-canal-sistema"' + (c.canalSistema !== false ? ' checked' : '') + '><label class="form-check-label" for="lemb-' + f.id + '-canal-sistema">Sistema (sino)</label></div>' +
          '</div>' +
          '<div class="form-group"><label class="form-label" for="lemb-' + f.id + '-dias-antes">Dias úteis antes do prazo</label><input type="number" id="lemb-' + f.id + '-dias-antes" class="form-control" min="0" value="' + (c.diasAntes || 1) + '"></div>' +
          '<div class="form-group"><label class="form-label" for="lemb-' + f.id + '-freq-pos">Frequência após vencido (dias)</label><input type="number" id="lemb-' + f.id + '-freq-pos" class="form-control" min="1" value="' + (c.frequenciaPosVencido || 3) + '"></div>' +
          '<div class="form-group"><label class="form-label" for="lemb-' + f.id + '-max-reenvios">Máx. de reenvios</label><input type="number" id="lemb-' + f.id + '-max-reenvios" class="form-control" min="0" value="' + (c.maxReenvios || 3) + '"></div>' +
          '<div class="form-group"><label class="form-label" for="lemb-' + f.id + '-escalar">Escalar pra Central após (dias)</label><input type="number" id="lemb-' + f.id + '-escalar" class="form-control" min="0" value="' + (c.escalarAdminApos || 10) + '"></div>' +
          '</div>' +
          '<button type="button" class="btn btn-secondary btn-sm" data-salvar-lembrete="' + f.id + '">Salvar</button>' +
          '</div>';
      }).join('');

      container.querySelectorAll('[data-salvar-lembrete]').forEach(function (btn) {
        btn.addEventListener('click', function () { salvarLembrete(btn.dataset.salvarLembrete, btn); });
      });
    }

    async function salvarLembrete(fluxoId, btn) {
      var orig = btn.textContent;
      btn.disabled = true; btn.textContent = 'Salvando…';
      try {
        await API.post('salvarConfigNotificacoes', {
          lembretes: { fluxo: fluxoId, dados: {
            ativo: document.getElementById('lemb-' + fluxoId + '-ativo').checked,
            canalEmail: document.getElementById('lemb-' + fluxoId + '-canal-email').checked,
            canalSistema: document.getElementById('lemb-' + fluxoId + '-canal-sistema').checked,
            diasAntes: parseInt(document.getElementById('lemb-' + fluxoId + '-dias-antes').value, 10) || 0,
            frequenciaPosVencido: parseInt(document.getElementById('lemb-' + fluxoId + '-freq-pos').value, 10) || 1,
            maxReenvios: parseInt(document.getElementById('lemb-' + fluxoId + '-max-reenvios').value, 10) || 0,
            escalarAdminApos: parseInt(document.getElementById('lemb-' + fluxoId + '-escalar').value, 10) || 0,
          } },
        });
        showToast('✅ Configuração salva.', 'success');
      } catch (err) {
        showToast('Erro: ' + err.message, 'error');
      } finally {
        btn.disabled = false; btn.textContent = orig;
      }
    }

    /* ── Reenvios ── */
    async function buscarReenvios() {
      var idEstagio = document.getElementById('reenvio-id-estagio').value.trim();
      if (!idEstagio) { showToast('Informe o ID do estágio.', 'error'); return; }
      var container = document.getElementById('lista-reenvios');
      container.innerHTML = '<div class="spinner" style="margin:0 auto;"></div>';
      try {
        var lista = await API.get('listarNotificacoesPendentes', { idEstagio: idEstagio });
        lista = Array.isArray(lista) ? lista : [];
        if (!lista.length) { container.innerHTML = '<p style="font-size:var(--font-size-sm);color:var(--color-text-muted);">Nenhuma notificação pendente encontrada.</p>'; return; }
        container.innerHTML = lista.map(function (n) {
          return '<div class="card" style="display:flex;align-items:center;justify-content:space-between;padding:var(--space-3) var(--space-4);margin-bottom:var(--space-2);">' +
            '<div><div style="font-weight:600;font-size:var(--font-size-sm);">' + escapeHtml(n.tipo || '—') + '</div>' +
            '<div style="font-size:var(--font-size-xs);color:var(--color-text-muted);">Pra: ' + escapeHtml(n.destinatario || '—') + '</div></div>' +
            '<button type="button" class="btn btn-secondary btn-sm" data-reenviar-id="' + escapeHtml(n.id) + '">Reenviar</button></div>';
        }).join('');
        container.querySelectorAll('[data-reenviar-id]').forEach(function (btn) {
          btn.addEventListener('click', function () { reenviarNotificacao(btn.dataset.reenviarId, btn); });
        });
      } catch (err) {
        container.innerHTML = '<div class="alert alert-error"><div class="alert-content">Erro: ' + escapeHtml(err.message) + '</div></div>';
      }
    }

    async function reenviarNotificacao(idNotificacao, btn) {
      var orig = btn.textContent;
      btn.disabled = true; btn.textContent = 'Enviando…';
      try {
        await API.post('reenviarNotificacao', { id: idNotificacao });
        showToast('✅ Reenviado.', 'success');
      } catch (err) {
        showToast('Erro: ' + err.message, 'error');
        btn.disabled = false; btn.textContent = orig;
      }
    }

    /* ── E-mails do Sistema (templates) ── */
    function renderListaTemplates() {
      document.getElementById('lista-templates').innerHTML = TEMPLATES_EMAIL.map(function (t) {
        return '<button type="button" class="btn btn-ghost btn-sm" style="display:block;width:100%;text-align:left;margin-bottom:var(--space-1);" data-template-id="' + t.id + '">' + escapeHtml(t.label) + '</button>';
      }).join('');
      document.querySelectorAll('[data-template-id]').forEach(function (btn) {
        btn.addEventListener('click', function () { abrirTemplate(btn.dataset.templateId); });
      });
    }

    async function abrirTemplate(templateId) {
      var editor = document.getElementById('editor-template');
      editor.innerHTML = '<div class="spinner" style="margin:0 auto;"></div>';
      try {
        var t = await API.get('obterTemplateEmail', { id: templateId });
        t = t || {};
        editor.innerHTML =
          '<div class="form-group"><label class="form-label" for="tpl-assunto">Assunto</label><input type="text" id="tpl-assunto" class="form-control" value="' + escapeHtml(t.assunto || '') + '"></div>' +
          '<div class="form-group"><label class="form-label" for="tpl-abertura">Parágrafo de abertura</label><textarea id="tpl-abertura" class="form-control" rows="3">' + escapeHtml(t.abertura || '') + '</textarea></div>' +
          '<div class="form-group"><label class="form-label" for="tpl-fechamento">Parágrafo de fechamento</label><textarea id="tpl-fechamento" class="form-control" rows="3">' + escapeHtml(t.fechamento || '') + '</textarea></div>' +
          '<p class="form-hint" style="margin-bottom:var(--space-4);">Variáveis disponíveis: {{nomeEstudante}}, {{idEstagio}}, {{curso}}, {{empresa}}, {{link}}</p>' +
          '<button type="button" class="btn btn-primary btn-sm" id="btn-salvar-template">Salvar Template</button>';
        document.getElementById('btn-salvar-template').addEventListener('click', function () { salvarTemplate(templateId, this); });
      } catch (err) {
        editor.innerHTML = '<div class="alert alert-error"><div class="alert-content">Erro: ' + escapeHtml(err.message) + '</div></div>';
      }
    }

    async function salvarTemplate(templateId, btn) {
      var orig = btn.textContent;
      btn.disabled = true; btn.textContent = 'Salvando…';
      try {
        await API.post('salvarTemplateEmail', {
          id: templateId,
          assunto: document.getElementById('tpl-assunto').value.trim(),
          abertura: document.getElementById('tpl-abertura').value.trim(),
          fechamento: document.getElementById('tpl-fechamento').value.trim(),
        });
        showToast('✅ Template salvo.', 'success');
      } catch (err) {
        showToast('Erro: ' + err.message, 'error');
      } finally {
        btn.disabled = false; btn.textContent = orig;
      }
    }
  </script>
</body>
</html>
